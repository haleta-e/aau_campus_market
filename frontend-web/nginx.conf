server {
    listen 80;
    server_name _;

    # Document root – served from the Vite build output
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Long-lived cache for hashed static assets (Vite adds content hashes) ─
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback: everything else serves index.html ─────────────────────
    # This is what makes React Router / Vite SPA routing work in production.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Healthcheck endpoint used by Render ──────────────────────────────────
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
