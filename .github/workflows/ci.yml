name: AAU Campus Market Backend CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & TypeScript Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aau_campus_market_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Compile TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Run Test Suite (Vitest)
        working-directory: ./backend
        env:
          NODE_ENV: test
          PORT: 4000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aau_campus_market_db
          DB_USER: postgres
          DB_PASSWORD: postgres_secure_password
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_change_in_production_32char
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_change_in_production_32char
        run: npm test

  docker-build:
    name: Build & Verify Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aau-campus-market-backend:latest
