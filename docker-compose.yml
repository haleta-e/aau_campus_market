services:
  db:
    image: postgres:16-alpine
    container_name: aau_campus_market_db
    restart: always
    environment:
      POSTGRES_DB: aau_campus_market_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aau_campus_market_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aau_campus_market_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: aau_campus_market_db
      DB_USER: postgres
      DB_PASSWORD: postgres_secure_password
      JWT_ACCESS_SECRET: default_jwt_access_secret_key_change_in_production_32char
      JWT_REFRESH_SECRET: default_jwt_refresh_secret_key_change_in_production_32char
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
